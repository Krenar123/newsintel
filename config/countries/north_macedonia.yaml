# North Macedonia — Pilot Country Configuration
# Add/remove sources as needed. Each source should have at least one RSS feed.

name: "North Macedonia"
code: "mk"
languages: ["mk", "en", "sq"]
timezone: "Europe/Skopje"
flag_emoji: "🇲🇰"

# Shared extraction defaults for Albanian-language WordPress-style portals.
# Source-specific listing and URL rules are defined on each source below.
x_albanian_scraper_defaults: &albanian_scraper_defaults
  enabled: true
  article_link_selectors:
    - "article a[href]"
    - "h1 a[href]"
    - "h2 a[href]"
    - "h3 a[href]"
    - "a[href]"
  exclude_url_patterns:
    - "/category/"
    - "/kategoria/"
    - "/tag/"
    - "/author/"
    - "/page/"
    - "/wp-content/"
    - "/wp-json/"
    - "/feed/"
    - "/comments/"
    - "/kontakt"
    - "/contact"
    - "/marketing"
    - "/privacy"
    - "/login"
    - "/register"
  selectors:
    title: "h1, meta[property='og:title']"
    body: ".entry-content, .td-post-content, .single-post-content, .post-content, .post-body, article"
    date: "meta[property='article:published_time'], time, .entry-date, .post-date"
    author: ".author-name, .author, .byline, [rel='author']"
    image: "meta[property='og:image']"
  min_word_count: 40
  min_unique_words: 25

